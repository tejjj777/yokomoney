# Netlify builds a smaller copy of the app (see tools/build.mjs) and serves dist/.
# Headers live in _headers, so they also apply when dist/ is uploaded by drag and drop.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
